version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0:
    image: judge0/judge0:latest
    ports:
      - "2358:2358"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
      - REDIS_URL=redis://redis:6379
      - RAILS_ENV=production
      - RACK_ENV=production
      - SECRET_KEY_BASE=your_secret_key_here
      - DATABASE_URL=postgresql://judge0:judge0@postgres/judge0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - judge0_data:/api/tmp

volumes:
  postgres_data:
  redis_data:
  judge0_data: