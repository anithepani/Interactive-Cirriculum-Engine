version: '3.8'

services:
  judge0-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  judge0-redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  judge0:
    image: judge0/judge0:latest
    ports:
      - "2358:2358"
    environment:
      - POSTGRES_HOST=judge0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
      - REDIS_URL=redis://judge0-redis:6379
      - RAILS_ENV=production
      - RACK_ENV=production
      - SECRET_KEY_BASE=your_secret_key_here
      - DATABASE_URL=postgresql://judge0:judge0@judge0-postgres/judge0
    depends_on:
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    volumes:
      - judge0_data:/api/tmp
    networks:
      - default

volumes:
  postgres_data:
  redis_data:
  judge0_data:

networks:
  default:
    name: ice_default
    external: true