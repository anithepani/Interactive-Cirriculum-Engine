[project]
name = "ice-worker"
version = "0.1.0"
description = "Celery worker - orchestrates the async generation pipeline (ingest->ASR->OCR->segment->gen->validate). Hosts M1, M4-M10 task definitions. Owner: Zubair."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ice-shared", "ice-contracts",
    "celery>=5.4.0", "flower>=2.0.1",
    "ice-api",
    "ice-ingestion", "ice-transcript", "ice-vision", "ice-segmentation",
    "ice-concept-graph", "ice-checkpoints", "ice-exercise-gen",
    "ice-test-gen", "ice-evaluation", "ice-adaptive", "ice-progress", "ice-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_worker"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
ice-api = { workspace = true }
ice-ingestion = { workspace = true }
ice-transcript = { workspace = true }
ice-vision = { workspace = true }
ice-segmentation = { workspace = true }
ice-concept-graph = { workspace = true }
ice-checkpoints = { workspace = true }
ice-exercise-gen = { workspace = true }
ice-test-gen = { workspace = true }
ice-evaluation = { workspace = true }
ice-adaptive = { workspace = true }
ice-progress = { workspace = true }
ice-llm = { workspace = true }

[project.scripts]
ice-worker = "ice_worker.celery_app:run"
