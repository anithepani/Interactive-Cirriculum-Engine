name: exercise_gen-conceptual
version: 0.1.0
model: gpt-4o
fallback_model: meta-llama/Llama-3.1-70B-Instruct
tier: high_value
temperature: 0.4
max_tokens: 2048
few_shot: true
owner: aryan
tags: [m7, exercise, conceptual]

inputs:
  - name: concept
    type: string
    description: The concept being tested (e.g. "Python self").
    required: true
  - name: concept_description
    type: string
    required: true
  - name: difficulty
    type: integer
    description: 1-5 difficulty target.
    required: true
  - name: segment_summary
    type: string
    required: true

output_schema:
  type: object
  required: [prompt, reference_answer, rubric, min_similarity]
  properties:
    prompt: {type: string, description: "Open-ended question requiring explanation/reasoning about the concept."}
    reference_answer: {type: string, description: "Model answer the learner's response is compared against."}
    rubric: {type: array, items: {type: string}, minItems: 1, description: "Grading rubric items for the LLM-as-judge."}
    min_similarity: {type: number, minimum: 0, maximum: 1, description: "Embedding-similarity threshold for auto-pass."}
    confidence: {type: number, minimum: 0, maximum: 1}

eval_baseline:
  agreement: 0.0
  run_at: 2026-07-08T00:00:00Z
