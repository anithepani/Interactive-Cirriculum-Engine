name: exercise_gen-mcq
version: 0.1.0
model: gpt-4o
fallback_model: meta-llama/Llama-3.1-70B-Instruct
tier: high_value
temperature: 0.4
max_tokens: 2048
few_shot: true
owner: aryan
tags: [m7, exercise, mcq]

inputs:
  - name: concept
    type: string
    description: The concept being tested (e.g. "Python dictionaries").
    required: true
  - name: concept_description
    type: string
    required: true
  - name: difficulty
    type: integer
    description: 1-5 difficulty target.
    required: true
  - name: segment_summary
    type: string
    required: true

output_schema:
  type: object
  required: [prompt, options, answer_idx, distractor_tags]
  properties:
    prompt: {type: string, description: "Question that requires reasoning about the concept, not recall."}
    options: {type: array, items: {type: string}, minItems: 2, description: "Answer options (typically 4)."}
    answer_idx: {type: integer, description: "0-based index of the correct option."}
    distractor_tags: {type: array, items: {type: string}, description: "Why each distractor is plausible (analytics, E13)."}
    confidence: {type: number, minimum: 0, maximum: 1}

eval_baseline:
  agreement: 0.0
  run_at: 2026-07-08T00:00:00Z
