name: test_gen-coding
version: 0.1.0
model: gpt-4o
fallback_model: Qwen/Qwen2.5-Coder-32B-Instruct
tier: high_value
temperature: 0.4
max_tokens: 2048
few_shot: true
owner: aryan
tags: [m8, test, generation, coding, python, mutation, codet]

inputs:
  - name: prompt
    type: string
    description: The exercise prompt the learner must solve.
    required: true
  - name: reference_solution
    type: string
    description: A correct Python reference solution (used to validate the tests pass).
    required: true
  - name: starter
    type: string
    description: Starter code skeleton defining the expected function signature.
    required: false
  - name: constraints
    type: string
    description: Optional constraints (time/space, allowed modules) as a joined list.
    required: false
  - name: difficulty
    type: integer
    description: 1-5 difficulty target; influences test depth.
    required: false

output_schema:
  type: object
  required: [tests_visible, tests_hidden]
  properties:
    tests_visible:
      type: array
      items: {type: string}
      description: "Basic single-line assert statements shown to the learner."
    tests_hidden:
      type: array
      items: {type: string}
      minItems: 1
      description: "Thorough assert statements (edge cases, boundaries) run in judge0; not shown."

eval_baseline:
  agreement: 0.0
  run_at: 2026-07-08T00:00:00Z
