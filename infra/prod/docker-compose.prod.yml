# ============================================================
# ICE — Production stack (single VM, /opt/ice)
# External managed: Neon (Postgres), Upstash (Redis)
# Self-hosted:       MinIO (S3), Caddy (TLS reverse proxy)
# Images pulled from GHCR: ghcr.io/<GHCR_OWNER>/ice/{api,worker}:<IMAGE_TAG>
# ============================================================
name: ice

services:
  api:
    image: ghcr.io/${GHCR_OWNER:-anithepani}/ice/api:${IMAGE_TAG:-latest}
    env_file: ../../.env
    expose:
      - "8000"
    depends_on: [minio]
    networks: [ice]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - PYTHONPATH=/app/apps/worker/src:/app/libs/shared/src:/app/libs/contracts/src:/app/apps/api/src
    volumes:
      - ../../:/app

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ../../.env

    # Tuned for Upstash free-tier (10K cmds/day):
    #   --without-gossip/-mingle/-heartbeat removes periodic Redis round-trips.
    #   -s 30 reduces scheduler ticks (one per 30s vs default 5s).
    command: ["uv", "run", "celery", "-A", "ice_worker.celery_app", "worker", "-l", "info", "--without-gossip", "--without-mingle", "--without-heartbeat", "-s", "30", "-c", "1"]
    # Sequential recap encoding keeps peak usage bounded. Keep headroom for
    # the API, MinIO, pot-provider, Caddy, and the host OS.
    mem_limit: 2g
    mem_reservation: 1g
    networks: [ice]
    restart: unless-stopped
    depends_on: [pot-provider]
    environment:
      - PYTHONPATH=/app/apps/worker/src:/app/libs/shared/src:/app/libs/contracts/src:/app/apps/api/src
      # PO Token provider sidecar: yt-dlp's bgutil plugin calls this HTTP service
      # to generate the Proof-of-Origin tokens YouTube now requires from
      # datacenter IPs. This is the primary bot-detection bypass (cookies were
      # dropped — they kept getting rotated/invalidated on the server).
      - YT_POT_PROVIDER_BASE_URL=http://pot-provider:4416
      # Ordered player clients to try on bot-block (maintainer-recommended:
      # mweb+PO token first, web_safari HLS next, tv last).
      - YT_PLAYER_CLIENTS=mweb,web_safari,tv
  # PO Token provider (bgutil). Generates YouTube Proof-of-Origin tokens on
  # demand so yt-dlp can download from the datacenter IP without cookies.
  # Maintained by a yt-dlp maintainer; self-refreshing, no manual tokens.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    networks: [ice]
    restart: unless-stopped
    expose:
      - "4416"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4416/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ice_minio
      MINIO_ROOT_PASSWORD: ice_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [ice]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ice]
    depends_on: [api]
    restart: unless-stopped

networks:
  ice:
    driver: bridge

volumes:
  minio_data:
  caddy_data:
  caddy_config:
