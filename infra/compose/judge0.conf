# ============================================================
# Judge0 1.13 configuration (M14 code sandbox) — dev stack.
# Mounted read-only into the judge0 + judge0-workers containers.
# Reuses the ICE dev Redis on an isolated DB index (3) and a
# dedicated Postgres (judge0-db) so it never collides with the
# application's Postgres/Redis data.
# ============================================================

# ---- Postgres (dedicated judge0-db service) ----
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

# ---- Redis (reuse the ICE redis service, isolated DB index 3) ----
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_DB=3
# Judge0 1.13 also reads a full URL in some code paths:
REDIS_URL=redis://redis:6379/3

# ---- Rails / Rack ----
RAILS_ENV=production
RACK_ENV=production
# Dev-only secret; rotate for any non-local deployment.
SECRET_KEY_BASE=ice_dev_judge0_secret_key_base_change_me

# ---- Resource / isolation limits (mirror SANDBOX_* settings) ----
# Wall/CPU time (seconds) and memory (KB) caps per submission.
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# ---- Network isolation (no outbound network from submissions) ----
ENABLE_NETWORK=false

# ---- Submission housekeeping ----
MAX_SUBMISSION_BATCH_SIZE=20
MAX_QUEUE_SIZE=100
ALLOW_ENQUEUE_WITH_WAIT=true
