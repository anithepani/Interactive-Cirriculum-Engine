name: Deploy

# Builds and pushes service images, then deploys to staging (on main)
# or production (on release tags). Phase 5+.

on:
  push:
    branches: [main]
    tags:
      - "release/v*"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations (staging)
        run: echo "TODO: run alembic upgrade head against staging DB"
      - name: Roll out (staging)
        run: echo "TODO: kubectl rollout or terraform apply for staging"

  deploy-production:
    name: Deploy to production (release tags)
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/release/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require golden eval to have passed
        run: echo "TODO: gate on eval-regression.yml artifact for this tag"
      - name: Apply migrations (production)
        run: echo "TODO: alembic upgrade head against prod DB"
      - name: Roll out (production)
        run: echo "TODO: kubectl rollout or terraform apply for production"
