[project]
name = "ice-contracts"
version = "0.1.0"
description = "Canonical data contracts (Pydantic) for the Interactive Curriculum Engine - the integration seam between AI producers and the application consumer (master plan section 5.3)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ice_contracts"]

[tool.hatch.metadata]
allow-direct-references = true
