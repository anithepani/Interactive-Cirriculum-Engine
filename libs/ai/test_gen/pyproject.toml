[project]
name = "ice-test-gen"
version = "0.1.0"
description = "M8 Test Generation & Validation - candidate tests + mutation testing + CodeT self-consistency + sandbox pre-validation. Lead: Aryan; Support: Zubair (sandbox)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ice-shared", "ice-contracts", "ice-llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_test_gen"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
ice-llm = { workspace = true }
