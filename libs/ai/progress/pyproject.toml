[project]
name = "ice-progress"
version = "0.1.0"
description = "M11 Learner Profile & Progress Tracker - skill model, mastery per concept, history, (stretch) FSRS-4.5 SRS. Lead: Zubair; Support: Aryan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ice-shared", "ice-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_progress"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
