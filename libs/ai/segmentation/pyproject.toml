[project]
name = "ice-segmentation"
version = "0.1.0"
description = "M4 Lesson Structure Analyzer - hybrid TextTiling + BGE-M3 embedding shift + BERTopic + GPT-4o refine. Lead: Aryan; Support: Ahmed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ice-shared", "ice-contracts", "ice-llm",
    "bertopic>=0.16.0", "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_segmentation"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
ice-llm = { workspace = true }
