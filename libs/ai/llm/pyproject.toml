[project]
name = "ice-llm"
version = "0.1.0"
description = "Shared LLM client abstraction - GPT-4o + Llama/Qwen routing, token budgets, caching, structured-output helpers (Hybrid strategy). Owner: Aryan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ice-shared",
    "groq>=0.11.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
    "sniffio>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_llm"]

[tool.uv.sources]
ice-shared = { workspace = true }
