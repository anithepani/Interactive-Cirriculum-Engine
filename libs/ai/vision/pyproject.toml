[project]
name = "ice-vision"
version = "0.1.0"
description = "M3 Visual Content Extraction - PaddleOCR/TrOCR code extraction, slide/diagram detection, keyframe dedup, Real-ESRGAN upscale. Lead: Ahmed; Support: Aryan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ice-shared", "ice-contracts",
    "rapidocr-onnxruntime>=1.3.0", "opencv-contrib-python>=4.10.0", "transformers>=4.44.0",
    "open_clip_torch>=2.24.0", "tree-sitter>=0.22.0", "tree-sitter-python>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_vision"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
