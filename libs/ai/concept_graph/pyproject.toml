[project]
name = "ice-concept-graph"
version = "0.1.0"
description = "M5 Knowledge Graph / Concept Mapper - LLM-extracted concept nodes + prerequisite/dependency edges mapped to a CS taxonomy. Lead: Aryan; Support: Zubair."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ice-shared", "ice-contracts", "ice-llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_concept_graph"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
ice-llm = { workspace = true }
