[project]
name = "ice-transcript"
version = "0.1.0"
description = "M2 Transcript & Metadata Extraction - Whisper large-v3 via faster-whisper + pyannote diarization + silero VAD. Lead: Aryan; Support: Zubair."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ice-shared", "ice-contracts",
    "faster-whisper>=1.0.3", "pyannote-audio>=3.3.0", "silero-vad>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_transcript"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
