[project]
name = "ice-checkpoints"
version = "0.1.0"
description = "M6 Checkpoint Placement Controller - places checkpoints at topic transitions + after learnable concepts; density cap >=90s. Lead: Aryan; Support: Zubair."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ice-shared", "ice-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_checkpoints"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
