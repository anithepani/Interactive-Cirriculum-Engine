[project]
name = "ice-evaluation"
version = "0.1.0"
description = "M9 Answer Evaluation & Feedback Engine - MCQ match, judge0 grading, LLM-as-judge, CodeBLEU anti-cheat. Lead: Aryan; Support: Zubair."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ice-shared", "ice-contracts", "ice-llm",
    "ruff>=0.6.0", "tree-sitter>=0.22.0", "tree-sitter-python>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ice_evaluation"]

[tool.uv.sources]
ice-shared = { workspace = true }
ice-contracts = { workspace = true }
ice-llm = { workspace = true }
