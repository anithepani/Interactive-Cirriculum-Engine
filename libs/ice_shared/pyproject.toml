[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ice_shared"
version = "0.1.0"
description = "Shared configuration, DB, logging for ICE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]